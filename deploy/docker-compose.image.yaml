services:
  meshmap:
    image: "${MESHMAP_IMAGE:-yellowcooln/meshcore-mqtt-live-map:latest}"
    container_name: meshmap-live
    ports:
      - "${WEB_PORT:-8080}:8080"
    env_file:
      - ../.env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    volumes:
      - ../data:/data
      - ../backup:/backup
